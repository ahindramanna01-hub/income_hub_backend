<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INCOME HUB OTP</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #360909, #080808 55%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 430px;
  text-align: center;
  padding: 35px 22px;
  border: 1px solid #ff2525;
  border-radius: 22px;
  background: rgba(20, 10, 10, 0.94);
  box-shadow: 0 0 30px #ff171744;
  animation: appear 1s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo {
  font-size: 42px;
  margin-bottom: 15px;
}

h1 {
  color: #ff3030;
  font-size: 27px;
  letter-spacing: 2px;
  text-shadow: 0 0 15px #ff0000;
}

.subtitle {
  color: #bbb;
  margin-top: 12px;
  line-height: 1.6;
  font-size: 14px;
}

.status {
  margin: 28px 0;
  padding: 15px;
  background: #171717;
  border: 1px solid #333;
  border-radius: 12px;
  color: #ff6262;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  background: #ff3030;
  border-radius: 50%;
  margin-right: 8px;
  box-shadow: 0 0 10px red;
}

.support {
  display: block;
  margin-top: 20px;
  padding: 15px;
  border-radius: 10px;
  background: linear-gradient(90deg, #b50000, #ff3030);
  color: white;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.support:hover {
  transform: scale(1.03);
  box-shadow: 0 0 20px #ff3030;
}

footer {
  margin-top: 28px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

  <div class="logo">✉️</div>

  <h1>INCOME HUB OTP</h1>

  <p class="subtitle">
    Welcome to Income Hub OTP.<br>
    A clean and simple email testing interface.
  </p>

  <div class="status">
    <span class="dot"></span>
    Website Online
  </div>

  <p class="subtitle">
    Email testing features are not connected yet.
  </p>

  <a class="support"
     href="https://t.me/mrmanna4"
     target="_blank">
     TELEGRAM SUPPORT
  </a>

  <footer>
    © 2026 INCOME HUB OTP
  </footer>

</div>
</body>
</html>
